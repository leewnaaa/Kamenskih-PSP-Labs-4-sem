<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор | Лабораторная работа №2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">

            <div id="result" class="result">0</div>

            <div class="buttons">
                <!-- первый ряд -->
                <div class="row">
                    <button id="btn_op_clear" class="my-btn secondary">C</button>
                    <button id="btn_op_backspace" class="my-btn secondary">⌫</button>
                    <button id="btn_op_sign" class="my-btn secondary">+/-</button>
                    <button id="btn_op_percent" class="my-btn secondary">%</button>
                </div>
                <!-- второй ряд -->
                <div class="row">
                    <button id="btn_op_sqrt" class="my-btn secondary">√</button>
                    <button id="btn_op_square" class="my-btn secondary">x²</button>
                    <button id="btn_op_factorial" class="my-btn secondary">x!</button>
                    <button id="btn_op_div" class="my-btn primary">/</button>
                </div>
                <!-- третий ряд -->
                <div class="row">
                    <button id="btn_digit_7" class="my-btn">7</button>
                    <button id="btn_digit_8" class="my-btn">8</button>
                    <button id="btn_digit_9" class="my-btn">9</button>
                    <button id="btn_op_mult" class="my-btn primary">x</button>
                </div>
                <!-- четвёртый ряд -->
                <div class="row">
                    <button id="btn_digit_4" class="my-btn">4</button>
                    <button id="btn_digit_5" class="my-btn">5</button>
                    <button id="btn_digit_6" class="my-btn">6</button>
                    <button id="btn_op_minus" class="my-btn primary">-</button>
                </div>
                <!-- пятый ряд -->
                <div class="row">
                    <button id="btn_digit_1" class="my-btn">1</button>
                    <button id="btn_digit_2" class="my-btn">2</button>
                    <button id="btn_digit_3" class="my-btn">3</button>
                    <button id="btn_op_plus" class="my-btn primary">+</button>
                </div>
                <!-- шестой ряд -->
                <div class="row">
                    <button id="btn_digit_0" class="my-btn">0</button>
                    <button id="btn_digit_dot" class="my-btn">.</button>
                    <button id="btn_op_equal" class="my-btn primary execute">=</button>
                    <button id="btn_op_triple_zero" class="my-btn secondary">000</button>
                </div>
                <!-- седьмой ряд -->
                <div class="row">
                    <button id="btn_op_cube" class="my-btn secondary">x³</button>
                    <button id="btn_change_output_color" class="my-btn secondary wide">Цвет вывода</button>
                    <button id="btn_change_bg_color" class="my-btn secondary wide">Цвет фона</button>
                </div>
            </div>

            <div class="extra-controls">
                <button id="theme-toggle" class="my-btn secondary">☾</button>
                <select id="color-select" class="dropdown">
                    <option value="default">Стандартная тема</option>
                    <option value="green">Зелёная тема</option>
                    <option value="blue">Синяя тема</option>
                </select>
                <button id="reset-theme" class="my-btn secondary"></button>
                <a href="https://github.com/leewnaaa/Kamenskih-PSP-Labs-4-sem/tree/lab1" target="_blank" class="github-link">GitHub</a>
                <a href="info.html" target="_blank" class="github-link">Инфа</a>
            </div>

            <details class="author-details">
                <summary>Автор</summary>
                <p>ФИО: Каменских Елена Александровна</p>
                <p>Группа: ИУ5-43Б</p>
            </details>

            <div class="lab-purpose">
                <p>Цель лабораторной работы:
                    <mark>знакомство</mark> с инструментами построения пользовательских интерфейсов web-сайтов:
                    <mark>HTML</mark>, <mark>CSS</mark>, <mark>JavaScript</mark>.
                </p>
            </div>

            <div class="footer-note">
                ЛР выполнена Каменских Е.А.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
