<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альфа-Банк</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f5f7;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .alfa-header {
            background: linear-gradient(135deg, #E31E24 0%, #B21217 100%);
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo i {
            font-size: 1.6rem;
            margin-right: 10px;
        }
        .tagline {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* новые стили для навигации и загрузки */
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .nav-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: white;
            color: #E31E24;
            transform: translateY(-2px);
        }
        .upload-area {
            background: rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        .upload-area label {
            cursor: pointer;
            margin: 0;
            font-weight: 500;
        }
        .upload-area input {
            display: none;
        }

        /* остальные существующие стили */
        .account-card {
            background: white;
            border-radius: 24px;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            height: 100%;
        }
        .account-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .card-header-red {
            background: #E31E24;
            padding: 0.75rem 1rem;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .card-body-custom {
            padding: 1.5rem;
        }
        .account-balance {
            font-size: 1.9rem;
            font-weight: 700;
            color: #1E2A3A;
            margin: 0.5rem 0;
        }
        .account-number {
            font-size: 0.85rem;
            color: #6c757d;
            letter-spacing: 1px;
        }
        .card-footer-custom {
            background: white;
            border-top: 1px solid #edf2f7;
            padding: 1rem 1.5rem 1.5rem;
        }
        .btn-alfa {
            background: #E31E24;
            border: none;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-alfa:hover {
            background: #B21217;
            transform: scale(1.02);
            box-shadow: 0 4px 10px rgba(227,30,36,0.3);
        }
        .btn-outline-alfa {
            background: transparent;
            border: 1px solid #E31E24;
            color: #E31E24;
            border-radius: 40px;
            font-weight: 600;
        }
        .btn-outline-alfa:hover {
            background: #E31E24;
            color: white;
        }
        .toast-container-custom {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1100;
            min-width: 280px;
        }
        .detail-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 550px;
            margin: 0 auto;
        }
        .detail-header {
            background: #E31E24;
            padding: 1.5rem;
            color: white;
        }
        .detail-body {
            padding: 2rem;
        }
        .back-button {
            background: none;
            border: none;
            font-size: 1rem;
            color: #E31E24;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: 0.2s;
        }
        .back-button i {
            margin-right: 8px;
        }
        .back-button:hover {
            color: #B21217;
            transform: translateX(-3px);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animated-page {
            animation: fadeInUp 0.3s ease-out;
        }
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: #8a99aa;
            border-top: 1px solid #e2e8f0;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="alfa-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <div class="logo">
                    <i class="fas fa-shield-alt"></i> Альфа-Банк
                </div>
                <div class="tagline">Управляйте счетами</div>
            </div>
            <div class="nav-links">
                <button id="nav-main-btn" class="nav-btn"><i class="fas fa-credit-card"></i> Мои счета</button>
                <button id="nav-gallery-btn" class="nav-btn"><i class="fas fa-cube"></i> 3D Галерея</button>
                <div class="upload-area">
                    <i class="fas fa-upload"></i>
                    <label for="uploadModelInput">Загрузить .glb</label>
                    <input type="file" id="uploadModelInput" accept=".glb">
                </div>
            </div>
        </div>
    </div>

    <div id="root" class="container my-4"></div>

    <div class="toast-container-custom" id="toastContainer"></div>

    <footer>
        <i class="fas fa-lock"></i> Безопасность превыше всего | © Альфа-Банк, 2025
    </footer>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script src="main.js" type="module"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
